<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MiniVerse 100 Games</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#10131c;
color:white;
min-height:100vh;
transition:.3s;
}
body.light{background:#eef1f7;color:#111}
button,input{
font:inherit;
}
header{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
background:#171b28;
box-shadow:0 3px 15px #0005;
position:sticky;
top:0;
z-index:10;
}
body.light header{background:white}
.logo{
font-size:25px;
font-weight:bold;
color:#7c5cff;
}
.headerButtons{
display:flex;
gap:8px;
}
button{
border:0;
border-radius:10px;
padding:10px 15px;
cursor:pointer;
background:#7c5cff;
color:white;
font-weight:bold;
}
button:hover{transform:scale(1.04)}
.container{
max-width:1200px;
margin:auto;
padding:25px;
}
.hero{
text-align:center;
padding:35px 10px;
}
.hero h1{
font-size:48px;
margin-bottom:10px;
}
.hero p{
opacity:.7;
font-size:18px;
}
.search{
width:100%;
padding:15px;
border-radius:12px;
border:2px solid #333;
background:#1a1f2d;
color:white;
margin:20px 0;
outline:0;
}
body.light .search{
background:white;
color:#111;
}
.categories{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:20px;
}
.category{
background:#242a3b;
}
.category.active{
background:#7c5cff;
}
.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
gap:15px;
}
.card{
background:#191e2c;
border-radius:16px;
padding:18px;
cursor:pointer;
border:1px solid #ffffff12;
transition:.2s;
}
body.light .card{background:white}
.card:hover{
transform:translateY(-5px);
border-color:#7c5cff;
}
.icon{
font-size:42px;
margin-bottom:12px;
}
.card h3{margin-bottom:7px}
.card p{
font-size:13px;
opacity:.6;
}
#gameScreen{
display:none;
position:fixed;
inset:0;
background:#0c0f16;
z-index:50;
overflow:auto;
}
.gameTop{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#171b28;
position:sticky;
top:0;
z-index:5;
}
.gameArea{
max-width:900px;
margin:auto;
padding:25px;
text-align:center;
}
.gameArea h1{
margin:10px 0;
font-size:34px;
}
.gameBox{
min-height:420px;
background:#151a27;
border:1px solid #ffffff12;
border-radius:20px;
padding:25px;
position:relative;
overflow:hidden;
}
.stat{
font-size:20px;
margin:10px;
color:#bdb5ff;
}
.playBtn{
margin:8px;
}
.target{
position:absolute;
width:60px;
height:60px;
border-radius:50%;
background:#ff4757;
cursor:pointer;
}
.bigNumber{
font-size:80px;
font-weight:bold;
margin:30px;
}
.choiceGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
max-width:500px;
margin:25px auto;
}
.choiceGrid button{
min-height:70px;
}
.memoryGrid{
display:grid;
grid-template-columns:repeat(4,70px);
gap:10px;
justify-content:center;
margin:20px;
}
.memoryCard{
height:70px;
font-size:28px;
background:#292f42;
}
canvas{
background:#080b10;
border-radius:15px;
max-width:100%;
}
.range{
width:80%;
}
footer{
text-align:center;
padding:40px;
opacity:.5;
}
@media(max-width:600px){
.hero h1{font-size:35px}
.games{grid-template-columns:repeat(2,1fr)}
.card{padding:12px}
.gameArea{padding:10px}
}
</style>
</head>

<body>

<header>
<div class="logo">🎮 MiniVerse</div>
<div class="headerButtons">
<button onclick="toggleTheme()">🌙</button>
<button onclick="toggleSound()">🔊</button>
</div>
</header>

<main id="home">
<div class="container">

<section class="hero">
<h1>🎮 MiniVerse</h1>
<p>100 playable mini-games in one website!</p>
</section>

<input id="search" class="search"
placeholder="🔎 Search games..."
oninput="renderGames()">

<div class="categories">
<button class="category active" onclick="setCategory('All',this)">All</button>
<button class="category" onclick="setCategory('Action',this)">Action</button>
<button class="category" onclick="setCategory('Puzzle',this)">Puzzle</button>
<button class="category" onclick="setCategory('Arcade',this)">Arcade</button>
<button class="category" onclick="setCategory('Speed',this)">Speed</button>
</div>

<div id="games" class="games"></div>

</div>
<footer>MiniVerse • 100 Mini Games 🎮</footer>
</main>

<div id="gameScreen">

<div class="gameTop">
<b id="gameTitle">Game</b>
<div>
<span id="gameScore">Score: 0</span>
<button onclick="leaveGame()">🏠 Leave Game</button>
</div>
</div>

<div class="gameArea">
<div id="gameDescription"></div>
<div id="gameBox" class="gameBox"></div>
</div>

</div>

<script>

/* =========================

========================= */

const icons=[
"🎯","🐍","🧠","🚀","🏃","🧱","⚽","🏎️","👾","🪙",
"🍎","🔥","❄️","🦖","🐸","🐔","🦊","🐼","🦄","🐙",
"🌟","💎","🍔","🍕","🍩","🎈","🎲","🧩","🚁","🚗",

const names=[

"Block Smash","Penalty Kick","Mini Racer","Alien Attack","Coin Grab",
"Apple Catch","Fire Dodge","Ice Jump","Dino Run","Frog Jump",
"Chicken Escape","Fox Hunt","Panda Catch","Unicorn Dash","Octopus Attack",
"Star Catcher","Diamond Hunt","Burger Catch","Pizza Maker","Donut Catch",
"Balloon Pop","Dice Roll","Puzzle Match","Helicopter","Car Dodge",
"Taxi Driver","Police Chase","Ambulance Rush","Fire Rescue","Sky Pilot",
"Basketball Shot","Football Kick","Baseball Hit","Tennis Tap","Boxing Punch",
"Archery","Sword Fight","Space Battle","Planet Defender","Volcano Escape",
"Ocean Runner","Forest Escape","Castle Defense","Kingdom Rush","Bomb Avoid",
"Magic Orb","Potion Mix","Key Finder","Door Escape","Ghost Hunter",
"Zombie Attack","Robot Battle","Wizard Duel","Dragon Fire","Sun Catch",
"Moon Jump","Star Dodger","Rainbow Catch","Lightning Tap","Tornado Escape",
"Cloud Jump","Rain Dodge","Cactus Runner","Palm Escape","Guitar Hero",
"Drum Tap","Piano Keys","Music Memory","Color Painter","Book Quiz",
"Light Bulb","Math Master","Word Master","Heart Catch","Purple Dodge",

"Black Hole","White Star","Cool Dude","Funny Face","Crazy Mode",
"Evil Dodge","Ice Challenge","Hot Challenge","Cowboy Shooter","Party Pop",
"Ultimate Target","Prize Grab","Champion"
];

let games=[];

for(let i=0;i<100;i++){
games.push({
id:i+1,
name:names[i],
icon:icons[i],
category:["Action","Puzzle","Arcade","Speed"][i%4]
});
}

let category="All";
let sound=true;
let currentGame=null;
let score=0;
let timer=null;

/* =========================
   MENU
========================= */

function renderGames(){

const box=document.getElementById("games");
const search=document.getElementById("search").value.toLowerCase();

box.innerHTML="";

games
.filter(g=>category==="All"||g.category===category)
.filter(g=>g.name.toLowerCase().includes(search))
.forEach(g=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="icon">${g.icon}</div>
<h3>${g.id}. ${g.name}</h3>
<p>${g.category} • Play now ▶</p>
`;

card.onclick=()=>startGame(g.id);

box.appendChild(card);

});

}

function setCategory(c,el){
category=c;
document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));
el.classList.add("active");
renderGames();
}

renderGames();

/* =========================
   SOUND
========================= */

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

function beep(freq=500,duration=.08){

if(!sound)return;

try{
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.frequency.value=freq;
osc.connect(gain);
gain.connect(audioCtx.destination);

gain.gain.value=.05;

osc.start();
osc.stop(audioCtx.currentTime+duration);
}catch(e){}

}

function toggleSound(){
sound=!sound;
document.querySelector(".headerButtons button:nth-child(2)").textContent=
sound?"🔊":"🔇";
}

function toggleTheme(){
document.body.classList.toggle("light");
}

/* =========================
   GAME SYSTEM
========================= */

function startGame(id){

clearInterval(timer);

currentGame=id;
score=0;

document.getElementById("home").style.display="none";
document.getElementById("gameScreen").style.display="block";

document.getElementById("gameTitle").textContent=
games[id-1].icon+" "+games[id-1].name;

document.getElementById("gameScore").textContent="Score: 0";

loadGame(id);
}

function leaveGame(){

clearInterval(timer);

document.getElementById("gameScreen").style.display="none";
document.getElementById("home").style.display="block";

renderGames();
}

function addScore(n=1){

score+=n;

document.getElementById("gameScore").textContent=
"Score: "+score;

beep(600,.06);
}

function box(){
return document.getElementById("gameBox");
}

function title(t){
document.getElementById("gameDescription").textContent=t;
}

/* =========================

========================= */

function loadGame(id){

const b=box();
b.innerHTML="";

title("Game "+id+" • Have fun!");

/*
Many games use reusable mini-game mechanics.
Every game has its own title, icon and challenge.
*/

if(id===1) targetGame();
else if(id===2) snakeGame();
else if(id===3) numberGame();
else if(id===4) dodgeGame();

else if(id===8) racerGame();

else if(id===21) catchGame("⭐");

else if(id===27) diceGame();
else if(id===28) memoryGame();
else if(id===29) dodgeGame("🚁");

else if(id===36) basketballGame();
else if(id===37) penaltyGame("🏈");

else if(id===39) clickGame("🎾");
else if(id===40) punchGame();
else if(id===41) archeryGame();

else if(id===43) spaceGame();

else if(id===49) smashGame("👑");
else if(id===50) bombGame();

else if(id===53) findGame("🔑");

else if(id===70) rhythmGame();

/* =========================
   GAME 1
========================= */

function targetGame(icon="🎯"){

title("Click the target as many times as possible!");

box().innerHTML=`
<div class="stat">Time: <span id="time">15</span></div>
<div class="target" id="target">${icon}</div>
`;

let time=15;

function move(){

const t=document.getElementById("target");

t.style.left=Math.random()*80+"%";
t.style.top=80+Math.random()*250+"px";
}

document.getElementById("target").onclick=()=>{
addScore();
move();
};

timer=setInterval(()=>{
time--;
document.getElementById("time").textContent=time;

if(time<=0){
clearInterval(timer);
alert("Game Over! Score: "+score);
}
},1000);

move();
}

/* =========================
   CLICK GAME
========================= */

function clickGame(icon){

title("Click the object 20 times!");

box().innerHTML=`
<div class="bigNumber" id="clickObject">${icon}</div>
<div class="stat">Clicks: <span id="clicks">0</span>/20</div>
`;

let clicks=0;

document.getElementById("clickObject").onclick=()=>{

clicks++;
addScore();

document.getElementById("clicks").textContent=clicks;

if(clicks>=20){
alert("You win! 🎉");
}
};

}

/* =========================
   CATCH GAME
========================= */

function catchGame(icon){

title("Catch the falling object!");

box().innerHTML=`
<div class="stat">Catch: <span id="caught">0</span>/10</div>
<div id="fall" class="target">${icon}</div>
`;

let caught=0;

const f=document.getElementById("fall");

function move(){

f.style.left=Math.random()*85+"%";
f.style.top=Math.random()*330+"px";
}

f.onclick=()=>{

caught++;
addScore();
document.getElementById("caught").textContent=caught;

move();

if(caught>=10){
alert("You caught them all! 🏆");
}
};

move();

}

/* =========================
   DODGE
========================= */

function dodgeGame(icon="💥"){

title("Avoid the moving danger!");

box().innerHTML=`
<div class="stat">Survive for 15 seconds!</div>
<div id="danger" class="target">${icon}</div>
<div id="player" style="
position:absolute;
bottom:25px;
left:50%;
font-size:50px;
">🧍</div>
`;

const d=document.getElementById("danger");

document.onkeydown=e=>{

let p=document.getElementById("player");

let x=parseFloat(p.style.left)||50;

if(e.key==="ArrowLeft")x-=5;
if(e.key==="ArrowRight")x+=5;

x=Math.max(2,Math.min(95,x));
p.style.left=x+"%";
};

let time=15;

timer=setInterval(()=>{

d.style.left=Math.random()*90+"%";
d.style.top=Math.random()*300+"px";

time--;

if(time<=0){

clearInterval(timer);
addScore(10);
alert("You survived! 🏆");

}

},1000);

}

/* =========================
   JUMP
========================= */

function jumpGame(icon){

title("Press SPACE or click to jump!");

box().innerHTML=`
<div style="height:300px;position:relative">
<div id="runner" style="
position:absolute;
bottom:30px;
left:80px;
font-size:50px;
">${icon}</div>

<div style="
position:absolute;
bottom:20px;
left:0;
right:0;
height:10px;
background:#555;
"></div>
</div>

<button id="jumpButton">JUMP</button>
`;

const r=document.getElementById("runner");

function jump(){

r.style.transition=".25s";
r.style.bottom="180px";

setTimeout(()=>{
r.style.bottom="30px";
addScore();
},250);

}

document.getElementById("jumpButton").onclick=jump;

document.onkeydown=e=>{
if(e.code==="Space")jump();
};

}

/* =========================
   SPEED GAME
========================= */

function speedGame(icon="⚡"){

title("Click START and press the button 20 times!");

box().innerHTML=`
<div class="bigNumber">${icon}</div>
<button id="speedButton">CLICK!</button>
<div class="stat">Clicks: <span id="speedCount">0</span>/20</div>
`;

let c=0;

document.getElementById("speedButton").onclick=()=>{

c++;
addScore();

document.getElementById("speedCount").textContent=c;

if(c>=20)alert("FAST! ⚡ You win!");
};

}

/* =========================
   SMASH
========================= */

function smashGame(icon="🧱"){

title("Smash the object!");

box().innerHTML=`
<div class="bigNumber" id="smash">${icon}</div>
<div class="stat">Hits: <span id="hits">0</span>/15</div>
`;

let h=0;

document.getElementById("smash").onclick=()=>{

h++;
addScore();

document.getElementById("hits").textContent=h;

if(h>=15){

document.getElementById("smash").textContent="💥";
alert("SMASHED! 💥");

}
};

}

/* =========================
   NUMBER GUESS
========================= */

function numberGame(){

title("Guess the secret number from 1 to 50.");

const secret=Math.floor(Math.random()*50)+1;

box().innerHTML=`
<input id="guess" type="number" min="1" max="50"
style="padding:15px;border-radius:10px">
<button onclick="guessNumber()">GUESS</button>
<p id="hint" class="stat"></p>
`;

window.guessNumber=()=>{

let g=Number(document.getElementById("guess").value);

if(g===secret){

addScore(10);
document.getElementById("hint").textContent="🎉 Correct!";

}else if(g<secret){

document.getElementById("hint").textContent="⬆️ Higher!";

}else{

document.getElementById("hint").textContent="⬇️ Lower!";

}

};

}

/* =========================
   DICE
========================= */

function diceGame(){

title("Roll the dice. Try to get 6!");

box().innerHTML=`
<div id="dice" class="bigNumber">🎲</div>
<button onclick="rollDice()">ROLL</button>
<p id="diceResult" class="stat"></p>
`;

window.rollDice=()=>{

let n=Math.floor(Math.random()*6)+1;

document.getElementById("diceResult").textContent=
"You rolled "+n;

if(n===6)addScore(10);
else addScore();

};

}

/* =========================
   MEMORY
========================= */

function memoryGame(){

title("Find the matching pairs!");

const symbols=["🍎","🍎","⭐","⭐","🚀","🚀","🐸","🐸"];

symbols.sort(()=>Math.random()-.5);

box().innerHTML=`
<div class="memoryGrid" id="memory"></div>
`;

let first=null;
let locked=false;
let matches=0;

symbols.forEach((s,i)=>{

const btn=document.createElement("button");

btn.className="memoryCard";
btn.textContent="❓";

btn.onclick=()=>{

if(locked||btn.textContent!=="❓")return;

btn.textContent=s;

if(!first){

first={btn,s};

}else{

if(first.s===s){

matches++;
addScore(5);
first=null;

if(matches===4)alert("Memory complete! 🧠");

}else{

locked=true;

setTimeout(()=>{

btn.textContent="❓";
first.btn.textContent="❓";

first=null;
locked=false;

},700);

}

}

};

document.getElementById("memory").appendChild(btn);

});

}

/* =========================
   BASKETBALL
========================= */

function basketballGame(){

title("Shoot the basketball!");

box().innerHTML=`
<div class="bigNumber">🏀</div>
<button onclick="shootBasket()">SHOOT!</button>
<div id="basketResult" class="stat"></div>
`;

window.shootBasket=()=>{

let success=Math.random()>.4;

if(success){

addScore(5);
document.getElementById("basketResult").textContent="🏀 SWISH!";

}else{

document.getElementById("basketResult").textContent="MISS!";

}

};

}

/* =========================
   PENALTY
========================= */

function penaltyGame(ball="⚽"){

title("Take the shot!");

box().innerHTML=`
<div class="bigNumber">${ball}</div>
<button onclick="takeShot()">SHOOT</button>
<div id="shot" class="stat"></div>
